# All services run on the host network. fedimintd's p2p and api are iroh (UDP),
# and stacking Docker's NAT on top of the router's would give iroh two layers to
# punch through instead of one. That means each service binds its own address
# rather than being contained by a published port, so the loopback binds below
# are what keep the Web UI, the log viewer and the Bitcoin RPC off the LAN.
services:
  fedimintd:
    image: fedimint/fedimintd:v0.11.2
    container_name: fedimintd
    restart: always
    network_mode: host
    depends_on:
      - bitcoind
    volumes:
      - fedimintd_data:/data
    environment:
      - FM_ENABLE_IROH=true
      - FM_BITCOIN_NETWORK=bitcoin
      - FM_BITCOIND_URL=http://127.0.0.1:8332
      - FM_BITCOIND_USERNAME=bitcoin
      - FM_BITCOIND_PASSWORD=bitcoin
      # p2p and api must be reachable from the internet for your guardian to
      # talk to its peers.
      - FM_BIND_P2P=0.0.0.0:8173
      - FM_BIND_API=0.0.0.0:8174
      # Web UI — loopback only, reachable from a browser on this machine and
      # nowhere else. Do not change this to 0.0.0.0: on the host network that
      # puts guardian administration on your LAN.
      - FM_BIND_UI=127.0.0.1:8175

  bitcoind:
    image: btcpayserver/bitcoin:31.0
    container_name: bitcoind
    restart: always
    network_mode: host
    volumes:
      - bitcoind_data:/data
    command:
      - bitcoind
      - -datadir=/data
      - -server=1
      # RPC is loopback only — fedimintd shares this network namespace, and
      # nothing else needs to reach it.
      - -rpcbind=127.0.0.1
      - -rpcallowip=127.0.0.1
      - -rpcuser=bitcoin
      - -rpcpassword=bitcoin
      - -dbcache=1024

  dozzle:
    image: amir20/dozzle:v10.7
    container_name: dozzle
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Browser log viewer — loopback only. Dozzle defaults to :8080, which on
      # the host network would bind every interface.
      - DOZZLE_ADDR=127.0.0.1:8080
      - DOZZLE_NO_ANALYTICS=true

volumes:
  fedimintd_data:
  bitcoind_data:
